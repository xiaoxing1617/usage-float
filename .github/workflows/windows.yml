# Builds the Windows installers on GitHub's Windows machines.
# Runs for every release tag (v*) and can be started by hand from the Actions tab.
# For a tag, the installers are attached to the GitHub Release with that tag.
name: Windows build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Test
        working-directory: src-tauri
        run: cargo test

      - name: Build installers (.exe and .msi)
        run: npm run tauri build -- --bundles nsis,msi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: usage-float-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            src-tauri/target/release/bundle/nsis/*.exe \
            src-tauri/target/release/bundle/msi/*.msi \
            --clobber
